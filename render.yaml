# Render Blueprint — https://render.com/docs/blueprint-spec
# Render reads this file when you choose "New → Blueprint" and connect the repo.
#
# One free web service runs Flask, which serves BOTH the REST API (/api/...)
# and the frontend pages. Same origin = simple, secure session cookies.
services:
  - type: web
    name: campusvoice
    runtime: python
    plan: free                       # free tier: sleeps after 15 min idle (~1 min cold start)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health     # fails (503) if the cloud database is unreachable
    autoDeploy: true                 # redeploy on every push to the main branch
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render creates a random secret for you
      - key: DATABASE_URL
        sync: false                  # you paste the Supabase connection string in the dashboard
      - key: DB_POOL_MAX
        value: "5"
      - key: SESSION_LIFETIME_MINUTES
        value: "120"
